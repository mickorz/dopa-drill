<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">甜甜 — 白色布偶猫 V5 精修（耳朵层级优化）</title>
<desc id="desc">纯矢量可编辑 SVG。V5 在 V4 基础上修复耳朵层级与遮挡关系，优化耳内毛束的可见区域和耳根衔接，同时保留蓝眼、短胖身体与蓬松灰尾。</desc>
<defs>
  <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffefd"/><stop offset="1" stop-color="#fff7f4"/>
  </linearGradient>
  <linearGradient id="furShade" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f8eeee"/><stop offset="1" stop-color="#eadcda"/>
  </linearGradient>
  <linearGradient id="point" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d9cecf"/><stop offset="1" stop-color="#b9aaac"/>
  </linearGradient>
  <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eee5e4"/><stop offset=".55" stop-color="#d6c7c9"/><stop offset="1" stop-color="#b6a6a9"/>
  </linearGradient>
  <radialGradient id="iris" cx="34%" cy="28%" r="76%">
    <stop offset="0" stop-color="#c9e4ff"/><stop offset=".38" stop-color="#78b5ff"/><stop offset=".72" stop-color="#4381da"/><stop offset="1" stop-color="#244e91"/>
  </radialGradient>
  <linearGradient id="bow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffc4d4"/><stop offset="1" stop-color="#ed8eab"/>
  </linearGradient>
  <radialGradient id="bell" cx="32%" cy="22%" r="78%">
    <stop offset="0" stop-color="#fff7bd"/><stop offset=".45" stop-color="#ffd773"/><stop offset="1" stop-color="#d79a35"/>
  </radialGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="eyeGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5"/></filter>
  <clipPath id="earLeftClip">
    <path d="M288 367 C277 293 282 193 322 121 C338 92 361 86 388 106 C420 130 454 159 477 188 C438 207 403 241 378 288 C356 329 332 359 288 367Z"/>
  </clipPath>
  <clipPath id="earRightClip">
    <path d="M736 367 C747 293 742 193 702 121 C686 92 663 86 636 106 C604 130 570 159 547 188 C586 207 621 241 646 288 C668 329 692 359 736 367Z"/>
  </clipPath>
  <style>
    .outline{stroke:#744947;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .mid{stroke:#744947;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .softline{stroke:#b39a99;stroke-width:3.1;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .furline{stroke:#dfd2d0;stroke-width:2.5;stroke-linecap:round;fill:none;opacity:.68}
  </style>
</defs>

